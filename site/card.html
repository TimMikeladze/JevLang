<!doctype html>
<!-- The OG card source. Same tokens as the page. Screenshot at exactly 1200x630. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{
  --paper:oklch(12.5% 0 0);--band:oklch(15.5% 0 0);--raise:oklch(18.5% 0 0);
  --ink:oklch(98.5% 0 0);--body:oklch(78% 0 0);--soft:oklch(63% 0 0);
  --line:oklch(100% 0 0/.11);--accent:oklch(70% .16 250);
  --add:oklch(72% .17 150);--del:oklch(68% .19 20);--warn:oklch(78% .15 85);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
body{position:relative;width:1200px;height:630px;background:var(--paper);color:var(--body);font-family:var(--sans);padding:72px 80px;display:flex;flex-direction:column;isolation:isolate;overflow:hidden}
.hero-pattern{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero-pattern-lines{stroke:var(--line);stroke-width:1.6}
.hero-pattern-dot{fill:var(--band);stroke:var(--line);stroke-width:1.6}
.hero-pattern-dot.hp-pivot{fill:var(--raise)}
.hp-trunk,.hp-branch{stroke-width:1.7}
.hp-accent{stroke:color-mix(in oklab,var(--accent) 55%,var(--line))}
.hp-add{stroke:color-mix(in oklab,var(--add) 55%,var(--line))}
.hp-warn{stroke:color-mix(in oklab,var(--warn) 55%,var(--line))}
.hp-del{stroke:color-mix(in oklab,var(--del) 55%,var(--line))}
.hp-accent-dot{stroke:color-mix(in oklab,var(--accent) 65%,var(--line))}
.hp-add-dot{stroke:color-mix(in oklab,var(--add) 65%,var(--line))}
.hp-warn-dot{stroke:color-mix(in oklab,var(--warn) 65%,var(--line))}
.hp-del-dot{stroke:color-mix(in oklab,var(--del) 65%,var(--line))}
h1{color:var(--ink);font-size:80px;line-height:1.05;letter-spacing:-.04em;font-weight:700;max-width:11ch}
h1 em{font-style:normal;color:var(--accent)}
.lede{margin-top:28px;font-size:24px;line-height:1.45;max-width:46ch;color:var(--body)}
.lede code{font-family:var(--mono);color:var(--ink);background:var(--raise);padding:.06em .3em;border-radius:.35em;font-size:.85em}
.row{margin-top:auto;display:flex;align-items:center;gap:20px;font:500 20px/1 var(--mono);color:var(--soft)}
.chip{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px 18px;color:var(--ink)}
.sep{color:var(--accent)}
</style>
</head>
<body>
<svg class="hero-pattern" aria-hidden="true" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="hp-fade" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/>
<stop offset=".4" stop-color="#fff" stop-opacity="0"/>
<stop offset=".68" stop-color="#fff" stop-opacity="1"/>
</linearGradient>
<mask id="hp-mask"><rect width="1200" height="520" fill="url(#hp-fade)"/></mask>
</defs>
<g mask="url(#hp-mask)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g class="hero-pattern-lines">
<path d="M860 132H1006V206"/>
<path d="M1140 40V96"/>
<path d="M980 366H1112"/>
<path d="M840 400H930"/>
<path d="M1180 250V326"/>
<circle class="hero-pattern-dot" cx="860" cy="132" r="4"/>
<circle class="hero-pattern-dot" cx="1006" cy="206" r="4"/>
<circle class="hero-pattern-dot" cx="1140" cy="40" r="4"/>
<circle class="hero-pattern-dot" cx="1140" cy="96" r="4"/>
<circle class="hero-pattern-dot" cx="980" cy="366" r="4"/>
<circle class="hero-pattern-dot" cx="1112" cy="366" r="4"/>
<circle class="hero-pattern-dot" cx="840" cy="400" r="4"/>
<circle class="hero-pattern-dot" cx="930" cy="400" r="4"/>
<circle class="hero-pattern-dot" cx="1180" cy="250" r="4"/>
<circle class="hero-pattern-dot" cx="1180" cy="326" r="4"/>
</g>
<g class="hp-trunk hp-accent"><path d="M900 60V120H980"/></g>
<circle class="hero-pattern-dot hp-pivot hp-accent-dot" cx="900" cy="60" r="4"/>
<circle class="hero-pattern-dot hp-pivot hp-accent-dot" cx="980" cy="120" r="5"/>
<g class="hp-branch hp-add"><path d="M980 120H1080"/></g>
<circle class="hero-pattern-dot hp-action hp-add-dot" cx="1080" cy="120" r="4"/>
<g class="hp-branch hp-warn"><path d="M980 120V190"/></g>
<circle class="hero-pattern-dot hp-action hp-warn-dot" cx="980" cy="190" r="4"/>
<g class="hp-trunk hp-accent"><path d="M1000 300V360"/></g>
<circle class="hero-pattern-dot hp-pivot hp-accent-dot" cx="1000" cy="300" r="4"/>
<circle class="hero-pattern-dot hp-pivot hp-accent-dot" cx="1000" cy="360" r="5"/>
<g class="hp-branch hp-add"><path d="M1000 360H1100"/></g>
<circle class="hero-pattern-dot hp-action hp-add-dot" cx="1100" cy="360" r="4"/>
<g class="hp-branch hp-del"><path d="M1000 360V430"/></g>
<circle class="hero-pattern-dot hp-action hp-del-dot" cx="1000" cy="430" r="4"/>
</g>
</svg>
<h1>Typesafe policy<br>for <em>LLM decisions</em></h1>
<p class="lede">jevlang is a typesafe policy engine for decisions an LLM used to make inside a prompt: routing, triage, approvals, guarding an agent's tools.</p>
<div class="row">
<span class="chip">bun add jevlang</span>
<span class="sep">·</span>
<span>a policy engine for prompt-sized decisions</span>
<span class="sep">·</span>
<span>jevlang.sh</span>
</div>
</body>
</html>
