<!doctype html>
<!-- The OG card source. Same tokens as the page. Screenshot at exactly 1200x630. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{
  --paper:oklch(12.5% 0 0);--raise:oklch(18.5% 0 0);
  --ink:oklch(98.5% 0 0);--body:oklch(78% 0 0);--soft:oklch(62% 0 0);
  --line:oklch(100% 0 0/.11);--accent:oklch(70% .16 250);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:var(--paper);color:var(--body);font-family:var(--sans);padding:72px 80px;display:flex;flex-direction:column}
.mark{width:64px;height:64px;margin-bottom:40px}
h1{color:var(--ink);font-size:76px;line-height:1.05;letter-spacing:-.04em;font-weight:700;max-width:15ch}
.lede{margin-top:28px;font-size:24px;line-height:1.45;max-width:46ch;color:var(--body)}
.row{margin-top:auto;display:flex;align-items:center;gap:20px;font:500 20px/1 var(--mono);color:var(--soft)}
.chip{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px 18px;color:var(--ink)}
.sep{color:var(--accent)}
</style>
</head>
<body>
<svg class="mark" viewBox="0 0 48 48" width="64" height="64" aria-hidden="true"><rect width="48" height="48" rx="11" fill="oklch(18.5% 0 0)"/><path d="M30 12v16.5c0 4.5-3 7.5-7.5 7.5S15 33 15 29.5" fill="none" stroke="oklch(98.5% 0 0)" stroke-width="3.4" stroke-linecap="round"/></svg>
<h1>Decide once, trust everywhere</h1>
<p class="lede">A policy engine for the decisions that used to live inside a prompt. Journaled, replayable, fail-safe.</p>
<div class="row">
<span class="chip">npm install github:TimMikeladze/JevLang</span>
<span>a policy engine for prompt-sized decisions</span>
<span class="sep">·</span>
<span>jevlang.sh</span>
</div>
</body>
</html>
