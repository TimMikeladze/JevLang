[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jevlang-sh"
version = "0.2.0.dev1"
description = "Local Python authoring and execution for portable JevLang policies"
license = { text = "MIT" }
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
jevlang = "jevlang.__main__:main"

[tool.setuptools]
packages = ["jevlang"]
include-package-data = true

[tool.setuptools.package-data]
jevlang = ["py.typed"]
